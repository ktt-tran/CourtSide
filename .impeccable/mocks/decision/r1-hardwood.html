<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F7F5F1;color:#1B1D1B;font-family:Nunito,system-ui,sans-serif;position:relative}
.num{font-variant-numeric:tabular-nums}
.floor{position:relative;height:236px;background:repeating-linear-gradient(90deg,#E3BD86 0 46px,#DDB47A 46px 47px,#E7C390 47px 93px,#DDB47A 93px 94px);overflow:hidden}
.floor svg{position:absolute;inset:0}
.status{position:relative;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:800;font-size:15px}
.hd{position:relative;padding:4px 16px}
.hd small{font-size:13px;font-weight:900;letter-spacing:.06em;color:#1F3A5F}
.hd h1{font-size:30px;font-weight:900;color:#1F3A5F;line-height:1.1}
.live{position:relative;margin:14px 16px 0;border-radius:20px;background:#fff;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 0 #CFA66C}
.key{width:86px;height:64px;border-radius:14px;background:#FF6B2C;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.key b{font-size:26px;font-weight:900;line-height:1}
.key span{font-size:11px;font-weight:900;margin-top:2px}
.t{font-size:16px;font-weight:800}
.m{font-size:14px;font-weight:700;color:#5B615C;margin-top:2px}
.lv{font-size:12px;font-weight:900;color:#C2410C;letter-spacing:.06em}
.chips{display:flex;gap:8px;padding:16px 16px 0}
.chip{height:34px;padding:0 14px;border-radius:17px;background:#fff;border:1.5px solid #E4DFD5;display:flex;align-items:center;font-size:14px;font-weight:800;color:#3F433F}
.chip.on{background:#1F3A5F;color:#fff;border-color:#1F3A5F}
.sec{padding:16px 16px 10px;font-size:13px;font-weight:900;letter-spacing:.08em;color:#5B615C}
.card{margin:0 16px 10px;border-radius:20px;background:#fff;border:1px solid #ECE7DE;padding:12px;display:flex;gap:14px;align-items:center}
.th{width:64px;height:64px;border-radius:14px;flex:none}
.when{font-size:13px;font-weight:900;color:#1F3A5F}
.sp{margin-left:auto;font-size:13px;font-weight:800;color:#5B615C;text-align:right}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-top:1px solid #ECE7DE;display:flex;justify-content:space-around;padding-top:10px}
.tab{width:90px;text-align:center;font-size:11px;font-weight:800;color:#5B615C}
.tab i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:13px;border:2px solid currentColor}
.tab.on{color:#1F3A5F}
.tab .plus{border:none;border-radius:8px;background:#FF6B2C;color:#1B1D1B;font-style:normal;font-size:20px;font-weight:900;line-height:26px}
</style></head><body>
<div class="floor"><svg width="390" height="236" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity=".85"><line x1="-10" y1="150" x2="400" y2="150"/><circle cx="300" cy="150" r="58"/><circle cx="300" cy="150" r="18" fill="#FF6B2C" stroke="none" opacity=".85"/><path d="M-10 60h120v180" stroke="#1F3A5F" stroke-opacity=".8"/></svg>
  <div class="status"><span class="num">9:41</span><span>●●● ▮</span></div>
  <div class="hd"><small>TONIGHT NEAR YOU</small><h1>One game is on</h1></div>

</div>
<div class="chips"><div class="chip on">All</div><div class="chip">Basketball</div><div class="chip">Soccer</div><div class="chip">Tennis</div></div>
<div class="sec">TODAY</div>
<div class="card"><svg class="th" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#5E9E6B"/><g fill="none" stroke="#fff" stroke-width="1.8"><rect x="8" y="10" width="48" height="44"/><line x1="8" y1="32" x2="56" y2="32"/><circle cx="32" cy="32" r="8"/></g></svg>
  <div><div class="when num">6:00 PM</div><div class="t">7v7 on North Field</div><div class="m">0.7 mi · dre hosting</div></div><div class="sp num">8/14<br>spots</div></div>
<div class="card"><svg class="th" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#3E7CA6"/><g fill="none" stroke="#fff" stroke-width="1.8"><rect x="10" y="8" width="44" height="48"/><line x1="10" y1="32" x2="54" y2="32"/><line x1="18" y1="8" x2="18" y2="56"/><line x1="46" y1="8" x2="46" y2="56"/><line x1="32" y1="20" x2="32" y2="44"/></g></svg>
  <div><div class="when num">7:30 PM</div><div class="t">Doubles, all levels</div><div class="m">Courts by Lot C · 1.1 mi</div></div><div class="sp num">2/4<br>spots</div></div>
<nav class="tabbar"><div class="tab on"><i></i>Games</div><div class="tab"><i class="plus">+</i>Host</div><div class="tab"><i></i>Profile</div></nav>
</body></html>
