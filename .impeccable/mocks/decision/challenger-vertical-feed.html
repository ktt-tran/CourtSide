.teams{font-size:16px;font-weight:800;color:rgba(255,255,255,.75)}
.rail{position:absolute;right:14px;bottom:200px;display:flex;flex-direction:column;gap:22px;align-items:center}
.rb{text-align:center;font-size:12px;font-weight:800}

.host{font-size:15px;font-weight:900}
.t{font-size:22px;font-weight:900;margin-top:4px}
.m{font-size:14px;font-weight:700;color:rgba(255,255,255,.75);margin-top:4px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:rgba(11,12,15,.92);display:flex;justify-content:space-around;padding-top:10px}
.tab{width:80px;text-align:center;font-size:11px;font-weight:800;color:#8a8d94}.tab.on{color:#FF6B2C}
.tab i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:12px;border:2px solid currentColor}
.plus{width:62px;height:62px;border-radius:31px;background:#FF6B2C;margin-top:-30px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#0B0C0F}
