<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#121317;color:#fff;font-family:Nunito,system-ui,sans-serif;position:relative}
.num{font-variant-numeric:tabular-nums}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:800;font-size:15px}
.brand{padding:4px 16px;font-size:24px;font-weight:900}.brand b{color:#FF6B2C}
.tabs{display:flex;gap:22px;padding:14px 16px 0;font-size:15px;font-weight:800;color:#7B7E86;border-bottom:1px solid #22252C}
.tabs span{padding-bottom:10px}.tabs .on{color:#fff;border-bottom:3px solid #FF6B2C}
.card{margin:14px 16px 0;border-radius:20px;background:#1E2026;overflow:hidden}
.img{height:150px;background:linear-gradient(160deg,#3B4E63,#1E2733);position:relative}
.img .live{position:absolute;left:12px;top:12px;background:#FF6B2C;color:#121317;font-weight:900;font-size:12px;padding:5px 10px;border-radius:12px}
.b{padding:14px}
.t{font-size:18px;font-weight:900}
.m{font-size:14px;font-weight:700;color:#9497A0;margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.av{display:flex}.av span{width:26px;height:26px;border-radius:13px;background:#3A3F49;border:2px solid #1E2026;margin-left:-7px}.av span:first-child{margin-left:0}
.cnt{font-size:13px;font-weight:800;color:#9497A0;margin-left:8px}
.join{height:38px;padding:0 20px;border-radius:19px;background:#FF6B2C;color:#121317;font-weight:900;display:flex;align-items:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#0E0F12;display:flex;justify-content:space-around;padding-top:10px}
.tab{width:80px;text-align:center;font-size:11px;font-weight:800;color:#A4A7AE}.tab.on{color:#FF6B2C}
.tab i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:12px;border:2px solid currentColor}
.plus{width:62px;height:62px;border-radius:31px;background:#FF6B2C;margin-top:-30px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#121317}
</style></head><body>
<div class="status"><span class="num">9:41</span><span>●●● ▮</span></div>

<div class="tabs"><span class="on">All</span><span>Basketball</span><span>Soccer</span><span>Tennis</span></div>
<div class="card"><div class="img"><span class="live num">● LIVE 14–11</span></div><div class="b"><div class="t">Sunday run at the Rec</div><div class="m">Rec Center courts · 0.4 mi · 22:14 in</div>
<div class="row"><div style="display:flex;align-items:center"><div class="av"><span></span><span></span><span></span></div><span class="cnt num">10/12</span></div><div class="join">Join</div></div></div></div>
<div class="card"><div class="img" style="background:linear-gradient(160deg,#2F5A3E,#1A2E22)"></div><div class="b"><div class="t">7v7 on North Field</div><div class="m">Today 6:00 PM · 0.7 mi</div>
<div class="row"><div style="display:flex;align-items:center"><div class="av"><span></span><span></span></div><span class="cnt num">8/14</span></div><div class="join">Join</div></div></div></div>
<nav class="tabbar"><div class="tab on"><i></i>Games</div><div class="plus">+</div><div class="tab"><i></i>Profile</div></nav>
</body></html>
