<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F3F4F2;color:#1B1D1B;font-family:Nunito,system-ui,sans-serif;position:relative}
.num{font-variant-numeric:tabular-nums}
/* soccer surface: mowed stripes */
.floor{position:relative;height:300px;background:repeating-linear-gradient(90deg,#3A7449 0 48px,#356C44 48px 96px);overflow:hidden}
.floor svg{position:absolute;inset:0}
.status{position:relative;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:800;font-size:15px;color:#fff}
.hd{position:relative;padding:4px 16px}
.hd small{font-size:13px;font-weight:900;letter-spacing:.06em;color:#EAF5EC}
.hd h1{font-size:30px;font-weight:900;color:#fff;line-height:1.1}
.chips{position:relative;display:flex;gap:8px;padding:14px 16px 0}
.chip{height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.92);display:flex;align-items:center;font-size:14px;font-weight:800;color:#1B1D1B}
.chip.on{background:#1F3A5F;color:#fff}
.live{position:relative;margin:16px 16px 0;border-radius:20px;background:#fff;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 0 #2A5636}
.key{min-width:86px;height:64px;padding:8px 12px;border-radius:14px;background:#FF6B2C;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.key b{font-size:26px;font-weight:900;line-height:1}
.key span{font-size:11px;font-weight:900;margin-top:2px}
.t{font-size:16px;font-weight:800}
.m{font-size:14px;font-weight:700;color:#5B615C;margin-top:2px}
.lv{font-size:12px;font-weight:900;color:#C2410C;letter-spacing:.06em}
.sec{padding:18px 16px 10px;font-size:13px;font-weight:900;letter-spacing:.08em;color:#5B615C}
.card{margin:0 16px 10px;border-radius:20px;background:#fff;border:1px solid #ECE7DE;padding:12px;display:flex;gap:14px;align-items:center}
.th{width:64px;height:64px;border-radius:14px;flex:none}
.when{font-size:13px;font-weight:900;color:#1F3A5F}
.sp{margin-left:auto;font-size:13px;font-weight:800;color:#5B615C;text-align:right}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-top:1px solid #ECE7DE;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px}
.tab{width:90px;text-align:center;font-size:11px;font-weight:800;color:#5B615C}
.tab i{display:block;width:26px;height:26px;margin:2px auto 4px;border-radius:13px;border:2px solid currentColor}
.tab.on{color:#1F3A5F}
.tab .plus{width:32px;height:32px;margin:0 auto 2px;border:none;border-radius:10px;background:#FF6B2C;color:#1B1D1B;font-style:normal;font-size:24px;font-weight:900;line-height:32px}
</style></head><body>
<div class="floor"><svg width="390" height="300" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".9">
  <rect x="-20" y="30" width="430" height="300"/><line x1="195" y1="30" x2="195" y2="330"/><circle cx="195" cy="200" r="62"/><circle cx="195" cy="200" r="4" fill="#fff"/>
  <rect x="-20" y="120" width="70" height="160"/><rect x="340" y="120" width="70" height="160"/></svg>
  <div class="status"><span class="num">9:41</span><span>●●● ▮</span></div>
  <div class="hd"><h1>One soccer game is on</h1></div>
  <div class="chips"><div class="chip">All</div><div class="chip">Basketball</div><div class="chip on">Soccer</div><div class="chip">Tennis</div></div>
  <div class="live"><div class="key num"><b>2–1</b><span>38:05</span></div><div><div class="lv">● LIVE · SOCCER</div><div class="t">Pickup 5v5, all welcome</div><div class="m">South Lawn · 0.5 mi · ana.r hosting</div></div></div>
</div>
<div class="sec">TODAY</div>
<div class="card"><svg class="th" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#5E9E6B"/><g fill="none" stroke="#fff" stroke-width="1.8"><rect x="8" y="10" width="48" height="44"/><line x1="8" y1="32" x2="56" y2="32"/><circle cx="32" cy="32" r="8"/></g></svg>
  <div><div class="when num">6:00 PM</div><div class="t">7v7 on North Field</div><div class="m">0.7 mi · dre hosting</div></div><div class="sp num">8/14<br>spots</div></div>
<div class="card"><svg class="th" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#5E9E6B"/><g fill="none" stroke="#fff" stroke-width="1.8"><rect x="8" y="10" width="48" height="44"/><line x1="8" y1="32" x2="56" y2="32"/><circle cx="32" cy="32" r="8"/></g></svg>
  <div><div class="when num">8:30 PM</div><div class="t">Night futsal</div><div class="m">Rec Center gym 2 · 0.4 mi</div></div><div class="sp num">6/10<br>spots</div></div>
<nav class="tabbar"><div class="tab on"><i></i>Games</div><div class="tab"><i class="plus">+</i>Host</div><div class="tab"><i></i>Profile</div></nav>
</body></html>
