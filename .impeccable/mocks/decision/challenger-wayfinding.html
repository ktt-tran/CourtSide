<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#15171C;color:#FFFFFF;font-family:Nunito,system-ui,sans-serif;position:relative}
.num{font-variant-numeric:tabular-nums}
.status{height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:800;font-size:15px}
h1{font-size:28px;font-weight:900;padding:6px 16px 16px}
.band{margin:0 16px 10px;border-radius:20px;background:#FF6B2C;color:#111;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.picto{width:56px;height:56px;border-radius:14px;background:#111;display:flex;align-items:center;justify-content:center}
.walk{font-size:44px;font-weight:900;line-height:.9;text-align:right}
.walk small{display:block;font-size:13px;font-weight:900;letter-spacing:.04em}
.where{font-size:19px;font-weight:900;line-height:1.15}
.what{font-size:14px;font-weight:800;margin-top:3px}
.arrow{font-size:28px;font-weight:900}
.band.dark{background:#1F2229;color:#FFF}
.band.dark .picto{background:#2E323B}
.band.dark .what{color:#A4A7AE}
.sec{padding:14px 16px 10px;font-size:13px;font-weight:900;letter-spacing:.08em;color:#8C8F96;text-transform:uppercase}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#111317;border-top:1px solid #23262D;display:flex;justify-content:space-around;padding-top:10px}
.tab{width:80px;text-align:center;font-size:11px;font-weight:800;color:#A4A7AE}.tab.on{color:#FF6B2C}
.tab i{display:block;width:24px;height:24px;margin:0 auto 4px;border-radius:12px;border:2px solid currentColor}
.plus{width:62px;height:62px;border-radius:31px;background:#FF6B2C;margin-top:-30px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#111;box-shadow:0 0 0 6px #15171C}
</style></head><body>
<div class="status"><span class="num">9:41</span><span>●●● ▮</span></div>
<h1>Where's the game?</h1>
<div class="sec">Live now</div>
<div class="band"><div class="picto"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="15" cy="15" r="12"/><path d="M3 15h24M15 3v24M6 6c5 5 5 13 0 18M24 6c-5 5-5 13 0 18"/></svg></div>
  <div><div class="where">Rec Center courts</div><div class="what num">Live 14–11 · 22:14 in</div></div>
  <div class="walk num">6<small>MIN WALK</small></div></div>
<div class="sec">Today</div>
<div class="band dark"><div class="picto"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="15" cy="15" r="12"/><path d="M15 9l5 4-2 6h-6l-2-6z"/></svg></div>
  <div><div class="where">North Field</div><div class="what num">7v7 · 6:00 PM · 8/14</div></div>
  <div class="walk num">11<small>MIN WALK</small></div></div>
<div class="band dark"><div class="picto"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="15" cy="15" r="12"/><path d="M5 8c6 4 6 10 0 14M25 8c-6 4-6 10 0 14"/></svg></div>
  <div><div class="where">Courts by Lot C</div><div class="what num">Doubles · 7:30 PM · 2/4</div></div>
  <div class="walk num">18<small>MIN WALK</small></div></div>
<div class="sec">Later this week</div>
<div class="band dark"><div class="picto"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.4"><path d="M15 4l11 11-11 11L4 15z"/></svg></div>
  <div><div class="where">The quad</div><div class="what num">Softball · Thu 5 PM · 5/18</div></div>
  <div class="walk num">4<small>MIN WALK</small></div></div>
<nav class="tabbar"><div class="tab on"><i></i>Games</div><div class="plus">+</div><div class="tab"><i></i>Profile</div></nav>
</body></html>
